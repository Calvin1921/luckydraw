<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc">
<title id="title">One host, three connected screens</title>
<desc id="desc">Prepare participants and prizes in the organizer dashboard. During the event the phone remote controls the draw. The projector stage and audience view display the shared result. Confirm to award and record; reject to keep the prize available. Fictional workflow illustration.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#edbc68"/></marker></defs>
<rect width="1080" height="510" rx="20" fill="#151920"/>
<g font-family="Arial, sans-serif" fill="#f7f5ee">
<text x="36" y="46" font-size="26" font-weight="700">One host. Three connected screens.</text>
<text x="36" y="77" font-size="17" fill="#c8cdd6">Prepare once → run the moment → keep a record</text>
<rect x="36" y="101" width="1008" height="48" rx="10" fill="#252c37"/>
<text x="54" y="132" font-size="18">BEFORE THE SHOW</text><text x="280" y="132" font-size="18" fill="#d6dae1">Organizer dashboard: add fictional guests and prize tiers</text>
<rect x="36" y="181" width="250" height="242" rx="16" fill="#252c37" stroke="#edbc68"/>
<text x="56" y="214" font-size="18" fill="#edbc68">1 / HOST’S PHONE</text>
<text x="56" y="250" font-size="24" font-weight="700">Remote control</text>
<rect x="56" y="275" width="210" height="48" rx="24" fill="#edbc68"/>
<text x="161" y="306" text-anchor="middle" font-size="20" fill="#151920" font-weight="700">DRAW</text>
<text x="56" y="354" font-size="18">Confirm → award prize</text>
<text x="56" y="386" font-size="18">Reject → draw again</text>
<path d="M296 290 H370" stroke="#edbc68" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="388" y="181" width="310" height="242" rx="16" fill="#252c37"/>
<text x="408" y="214" font-size="18" fill="#edbc68">2 / PROJECTOR</text>
<text x="408" y="250" font-size="24" font-weight="700">Draw stage</text>
<text x="408" y="288" font-size="17" fill="#c8cdd6">Show the selected guest</text>
<text x="408" y="342" font-size="27" font-weight="700">Demo Guest 042</text>
<text x="408" y="380" font-size="18" fill="#c8cdd6">Demo Gift Voucher</text>
<rect x="720" y="181" width="324" height="242" rx="16" fill="#252c37"/>
<text x="740" y="214" font-size="18" fill="#edbc68">3 / AUDIENCE DISPLAY</text>
<text x="740" y="250" font-size="24" font-weight="700">Audience view</text>
<text x="740" y="288" font-size="17" fill="#c8cdd6">Follow the same result</text>
<text x="740" y="342" font-size="27" font-weight="700">Demo Guest 042</text>
<text x="740" y="380" font-size="18" fill="#c8cdd6">Demo Gift Voucher</text>
<text x="36" y="460" font-size="18">AFTER EACH DRAW</text><text x="260" y="460" font-size="18" fill="#d6dae1">Actions are logged; confirmed winners appear in the dashboard.</text>
<text x="36" y="490" font-size="14" fill="#aab3c1">Workflow illustration • entirely fictional data • shared result state, not frame-locked animation</text>
</g></svg>